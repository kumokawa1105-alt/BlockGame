<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック崩し</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Orbitron:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      font-family: 'Noto Sans JP', sans-serif;
      color: #33cc33;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 80, 80, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .game-header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #00ffff;
      text-shadow:
        0 0 20px rgba(0, 255, 255, 0.8),
        0 0 40px rgba(0, 255, 255, 0.4),
        0 2px 0 #008888;
    }

    .game-info {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
      font-weight: 700;
      align-items: center;
    }

    .game-info span {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
    }

    .score-label, .level-label {
      color: #228822;
      font-size: 0.85em;
    }

    .score-value {
      color: #ffcc00;
      text-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
      min-width: 2.5em;
      text-align: right;
    }

    .level-value {
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    .lives-value {
      color: #ff3333;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
    }

    .canvas-wrap {
      position: relative;
      padding: 4px;
      background: linear-gradient(135deg, #0a3030 0%, #051515 50%, #0a2020 100%);
      border-radius: 6px;
      box-shadow:
        0 0 0 2px #00ffff,
        0 0 30px rgba(0, 255, 255, 0.25),
        0 0 60px rgba(0, 0, 0, 0.5),
        inset 0 0 100px rgba(0, 0, 0, 0.7);
    }

    .canvas-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
      pointer-events: none;
    }

    #gameCanvas {
      display: block;
      background: #0a0a0a;
      border-radius: 4px;
      border: 1px solid #114444;
    }

    .instructions {
      margin-top: 0.9rem;
      font-size: 0.78rem;
      color: #226622;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 5, 8, 0.97);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 0.6rem;
      letter-spacing: 0.1em;
    }

    #gameOverOverlay h2 {
      color: #ff3333;
      text-shadow: 0 0 20px rgba(255, 51, 51, 0.9), 0 0 40px rgba(255, 51, 51, 0.4);
    }

    #winOverlay h2, #levelUpOverlay h2 {
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.9), 0 0 40px rgba(0, 255, 255, 0.4);
    }

    #levelUpOverlay .level-num {
      font-size: 3rem;
      color: #ffcc00;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
      margin: 0.5rem 0 1rem;
    }

    .overlay .message {
      color: #33cc33;
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }

    .overlay .final-score {
      font-size: 1.2rem;
      color: #ffcc00;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
    }

    .btn-retro {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem 2.2rem;
      border: 2px solid #00ffff;
      border-radius: 4px;
      background: transparent;
      color: #00ffff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }

    .btn-retro:hover {
      background: #00ffff;
      color: #050508;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.7);
      transform: scale(1.03);
    }

    .btn-retro:active {
      transform: scale(0.98);
    }

    .top-right {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }

    .bgm-note {
      font-size: 0.75rem;
      color: #336666;
    }

    #pauseBtn {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.8rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid #00aaaa;
      border-radius: 4px;
      background: rgba(0, 20, 20, 0.9);
      color: #00cccc;
      cursor: pointer;
    }

    #pauseBtn:hover {
      background: rgba(0, 40, 40, 0.95);
      color: #00ffff;
    }

    #startOverlay .btn-retro {
      font-size: 1.2rem;
      padding: 1rem 2.5rem;
    }

    #pauseOverlay h2 {
      color: #ffcc00;
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="game-header">
    <h1>ブロック崩し</h1>
  </div>
  <div class="game-info">
    <span><span class="score-label">スコア</span><span class="score-value" id="scoreDisplay">0</span></span>
    <span><span class="level-label">レベル</span><span class="level-value" id="levelDisplay">1</span></span>
    <span><span class="score-label">残りライフ</span><span class="lives-value" id="livesDisplay">3</span></span>
  </div>
  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="480" height="560"></canvas>
  </div>
  <p class="instructions">マウスまたはタッチでパドルを動かします</p>
  <div class="top-right">
    <span class="bgm-note" id="bgmNote">※BGMは画面クリックで再生</span>
    <button type="button" id="pauseBtn" style="display: none;">一時停止</button>
  </div>

  <div class="overlay visible" id="startOverlay">
    <h2 style="color: #00ffff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); margin-bottom: 1rem;">ブロック崩し</h2>
    <p class="message" style="margin-bottom: 1.5rem;">スタートボタンでゲーム開始</p>
    <button type="button" class="btn-retro" id="startBtn">スタート</button>
  </div>

  <div class="overlay" id="pauseOverlay">
    <h2>一時停止</h2>
    <button type="button" class="btn-retro" id="resumeBtn">再開</button>
  </div>

  <div class="overlay" id="gameOverOverlay">
    <h2>GAME OVER</h2>
    <p class="message">ブロックをすべて崩せませんでした</p>
    <p class="final-score">スコア: <span id="finalScore">0</span> / レベル <span id="finalLevel">1</span></p>
    <button type="button" class="btn-retro" id="restartBtn">もう一度プレイ</button>
  </div>

  <div class="overlay" id="winOverlay">
    <h2>ALL CLEAR</h2>
    <p class="message">おめでとう！すべてクリアしました</p>
    <p class="final-score">スコア: <span id="winScore">0</span></p>
    <button type="button" class="btn-retro" id="restartBtnWin">もう一度プレイ</button>
  </div>

  <div class="overlay" id="levelUpOverlay">
    <h2>LEVEL UP</h2>
    <p class="level-num" id="levelUpNum">2</p>
    <p class="message">ボールが速くなります！</p>
    <button type="button" class="btn-retro" id="nextLevelBtn">つづける</button>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const PADDLE_WIDTH = 90;
      const PADDLE_HEIGHT = 14;
      const BALL_RADIUS = 8;
      const BRICK_COLUMNS = 10;
      const BRICK_ROWS = 8;
      const BRICK_PADDING = 6;
      const BRICK_OFFSET_TOP = 70;
      const BRICK_OFFSET_LEFT = 20;

      const BASE_SPEED = 5.2;
      const MAX_SPEED = 10;

      const COLORS = [
        '#00ff00', '#33ff33', '#00ffff', '#ff00ff', '#ffff00',
        '#ff6600', '#ff0000', '#ffffff', '#00cc00', '#ff33ff',
        '#00cccc', '#ccff00', '#ff9900'
      ];

      let paddleX, paddleY, ballX, ballY, ballDX, ballDY;
      let score = 0;
      let lives = 3;
      let level = 1;
      let bricks = [];
      let particles = [];
      let gameRunning = false;
      let gameStarted = false;
      let gamePaused = false;
      let animationId;
      let mouseX = canvas.width / 2;
      let levelUpShown = false;

      const scoreDisplay = document.getElementById('scoreDisplay');
      const livesDisplay = document.getElementById('livesDisplay');
      const levelDisplay = document.getElementById('levelDisplay');
      const gameOverOverlay = document.getElementById('gameOverOverlay');
      const winOverlay = document.getElementById('winOverlay');
      const levelUpOverlay = document.getElementById('levelUpOverlay');
      const finalScoreEl = document.getElementById('finalScore');
      const finalLevelEl = document.getElementById('finalLevel');
      const winScoreEl = document.getElementById('winScore');
      const levelUpNumEl = document.getElementById('levelUpNum');
      const bgmNoteEl = document.getElementById('bgmNote');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const pauseOverlay = document.getElementById('pauseOverlay');
      const resumeBtn = document.getElementById('resumeBtn');

      function getBallSpeed() {
        const speed = BASE_SPEED + (level - 1) * 0.8;
        return Math.min(speed, MAX_SPEED);
      }

      function brickWidth() {
        return (canvas.width - BRICK_OFFSET_LEFT * 2 - BRICK_PADDING * (BRICK_COLUMNS - 1)) / BRICK_COLUMNS;
      }

      function brickHeight() {
        return 22;
      }

      function initBricks() {
        bricks = [];
        const bw = brickWidth();
        const bh = brickHeight();
        for (let c = 0; c < BRICK_COLUMNS; c++) {
          bricks[c] = [];
          for (let r = 0; r < BRICK_ROWS; r++) {
            bricks[c][r] = {
              x: BRICK_OFFSET_LEFT + c * (bw + BRICK_PADDING),
              y: BRICK_OFFSET_TOP + r * (bh + BRICK_PADDING),
              w: bw,
              h: bh,
              visible: true,
              color: COLORS[(c + r + level - 1) % COLORS.length]
            };
          }
        }
      }

      function createParticles(x, y, color) {
        const count = 10 + Math.floor(level * 0.5);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          const speed = 2 + Math.random() * 4;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: color,
            size: 2 + Math.random() * 3
          });
        }
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.035;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function drawParticles() {
        particles.forEach(function (p) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      }

      function initGame(showStartScreen) {
        paddleX = (canvas.width - PADDLE_WIDTH) / 2;
        paddleY = canvas.height - PADDLE_HEIGHT - 25;
        ballX = canvas.width / 2;
        ballY = paddleY - BALL_RADIUS - 2;
        const speed = getBallSpeed();
        ballDX = speed * (Math.random() > 0.5 ? 1 : -1);
        ballDY = -speed;
        score = 0;
        lives = 3;
        level = 1;
        particles = [];
        gameOverOverlay.classList.remove('visible');
        winOverlay.classList.remove('visible');
        levelUpOverlay.classList.remove('visible');
        pauseOverlay.classList.remove('visible');
        gamePaused = false;
        levelUpShown = false;
        initBricks();
        updateUI();
        gameRunning = true;
        if (showStartScreen) {
          gameStarted = false;
          startOverlay.classList.add('visible');
          pauseBtn.style.display = 'none';
        } else {
          gameStarted = true;
          startOverlay.classList.remove('visible');
          pauseBtn.style.display = 'block';
        }
      }

      function updateUI() {
        scoreDisplay.textContent = score;
        livesDisplay.textContent = lives;
        levelDisplay.textContent = level;
      }

      function drawPaddle() {
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(paddleX, paddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.strokeStyle = '#00aaaa';
        ctx.lineWidth = 1;
        ctx.strokeRect(paddleX, paddleY, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(paddleX + 2, paddleY + 2, PADDLE_WIDTH - 4, 4);
      }

      function drawBall() {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawBricks() {
        for (let c = 0; c < BRICK_COLUMNS; c++) {
          for (let r = 0; r < BRICK_ROWS; r++) {
            const b = bricks[c][r];
            if (!b.visible) continue;
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#0a0a0a';
            ctx.lineWidth = 1;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 4);
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawParticles();
        drawPaddle();
        drawBall();
      }

      function collisionDetection() {
        for (let c = 0; c < BRICK_COLUMNS; c++) {
          for (let r = 0; r < BRICK_ROWS; r++) {
            const b = bricks[c][r];
            if (!b.visible) continue;
            if (ballX + BALL_RADIUS > b.x && ballX - BALL_RADIUS < b.x + b.w &&
                ballY + BALL_RADIUS > b.y && ballY - BALL_RADIUS < b.y + b.h) {
              ballDY = -ballDY;
              const cx = b.x + b.w / 2;
              const cy = b.y + b.h / 2;
              createParticles(cx, cy, b.color);
              b.visible = false;
              score += 10 * level;
              updateUI();
              playBreakSound();
            }
          }
        }

        if (ballX + ballDX > canvas.width - BALL_RADIUS || ballX + ballDX < BALL_RADIUS) {
          ballDX = -ballDX;
        }
        if (ballY + ballDY < BALL_RADIUS) {
          ballDY = -ballDY;
        }

        if (ballY + ballDY > paddleY - BALL_RADIUS &&
            ballY - BALL_RADIUS < paddleY + PADDLE_HEIGHT &&
            ballX + BALL_RADIUS > paddleX && ballX - BALL_RADIUS < paddleX + PADDLE_WIDTH) {
          const hitPos = (ballX - (paddleX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
          const speed = Math.hypot(ballDX, ballDY);
          ballDY = -Math.abs(ballDY);
          ballDX = hitPos * (speed * 0.6);
        }

        if (ballY + BALL_RADIUS > canvas.height) {
          lives--;
          updateUI();
          if (lives <= 0) {
            gameOver();
            return;
          }
          const speed = getBallSpeed();
          ballX = canvas.width / 2;
          ballY = paddleY - BALL_RADIUS - 2;
          ballDX = speed * (Math.random() > 0.5 ? 1 : -1);
          ballDY = -speed;
        }
      }

      function allBricksGone() {
        for (let c = 0; c < BRICK_COLUMNS; c++) {
          for (let r = 0; r < BRICK_ROWS; r++) {
            if (bricks[c][r].visible) return false;
          }
        }
        return true;
      }

      function gameOver() {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        finalScoreEl.textContent = score;
        finalLevelEl.textContent = level;
        gameOverOverlay.classList.add('visible');
        stopBGM();
      }

      function win() {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        winScoreEl.textContent = score;
        winOverlay.classList.add('visible');
        stopBGM();
      }

      function showLevelUp() {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        levelUpNumEl.textContent = level;
        levelUpOverlay.classList.add('visible');
      }

      function goNextLevel() {
        levelUpOverlay.classList.remove('visible');
        initBricks();
        updateUI();
        ballX = canvas.width / 2;
        ballY = paddleY - BALL_RADIUS - 2;
        const speed = getBallSpeed();
        ballDX = speed * (Math.random() > 0.5 ? 1 : -1);
        ballDY = -speed;
        gameRunning = true;
        animationId = requestAnimationFrame(update);
      }

      function update() {
        paddleX = mouseX - PADDLE_WIDTH / 2;
        paddleX = Math.max(0, Math.min(canvas.width - PADDLE_WIDTH, paddleX));

        if (!gameStarted) {
          draw();
          animationId = requestAnimationFrame(update);
          return;
        }
        if (gamePaused) {
          draw();
          animationId = requestAnimationFrame(update);
          return;
        }
        if (!gameRunning) return;
        collisionDetection();
        updateParticles();
        if (allBricksGone()) {
          level++;
          levelUpNumEl.textContent = level;
          levelUpShown = true;
          showLevelUp();
          return;
        }
        ballX += ballDX;
        ballY += ballDY;
        draw();
        animationId = requestAnimationFrame(update);
      }

      var audioCtx = null;
      var bgmInterval = null;
      var breakOsc = null;

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      function playBreakSound() {
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
          osc.type = 'square';
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.1);
        } catch (e) {}
      }

      function startBGM() {
        if (!audioCtx) initAudio();
        if (bgmInterval) return;
        bgmNoteEl.textContent = 'BGM: ON';
        var step = 0;
        var notes = [262, 330, 392, 523, 392, 330, 262, 196, 262, 330, 392, 392, 392, 330, 262, 330, 392, 392, 330, 262];
        var beat = 0.2;
        function tick() {
          if (!audioCtx || !gameRunning) return;
          try {
            var osc = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.frequency.value = notes[step % notes.length];
            osc.type = 'square';
            g.gain.setValueAtTime(0.06, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + beat * 0.8);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + beat);
          } catch (e) {}
          step++;
        }
        tick();
        bgmInterval = setInterval(tick, beat * 1000);
      }

      function stopBGM() {
        if (bgmInterval) {
          clearInterval(bgmInterval);
          bgmInterval = null;
        }
        bgmNoteEl.textContent = '※BGMは画面クリックで再生';
      }

      function onFirstInteraction() {
        document.body.removeEventListener('click', onFirstInteraction);
        document.body.removeEventListener('touchstart', onFirstInteraction);
        initAudio();
        if (gameRunning) startBGM();
      }

      document.body.addEventListener('click', onFirstInteraction);
      document.body.addEventListener('touchstart', onFirstInteraction);

      function setPaddleFromClientX(clientX) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        mouseX = (clientX - rect.left) * scaleX;
      }

      canvas.addEventListener('mousemove', function (e) {
        setPaddleFromClientX(e.clientX);
      });

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches.length) setPaddleFromClientX(e.touches[0].clientX);
      }, { passive: true });

      canvas.addEventListener('touchmove', function (e) {
        if (e.touches.length) {
          setPaddleFromClientX(e.touches[0].clientX);
          e.preventDefault();
        }
      }, { passive: false });

      startBtn.addEventListener('click', function () {
        startOverlay.classList.remove('visible');
        gameStarted = true;
        pauseBtn.style.display = 'block';
        if (audioCtx) startBGM();
      });

      pauseBtn.addEventListener('click', function () {
        if (!gameStarted || !gameRunning) return;
        gamePaused = true;
        pauseOverlay.classList.add('visible');
      });

      resumeBtn.addEventListener('click', function () {
        gamePaused = false;
        pauseOverlay.classList.remove('visible');
      });

      document.getElementById('restartBtn').addEventListener('click', function () {
        initGame(false);
        update();
        if (audioCtx) startBGM();
      });

      document.getElementById('restartBtnWin').addEventListener('click', function () {
        initGame(false);
        update();
        if (audioCtx) startBGM();
      });

      document.getElementById('nextLevelBtn').addEventListener('click', function () {
        goNextLevel();
        if (audioCtx) startBGM();
      });

      initGame(true);
      update();
    })();
  </script>
</body>
</html>
